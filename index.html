<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop - Online Store</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffaf7;
  color: #29243b;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 7%;
  background: white;
  box-shadow: 0 2px 12px #ddd;
  position: sticky;
  top: 0;
}
.logo { font-size: 26px; font-weight: bold; color: #7546db; }
nav a {
  margin-left: 18px;
  text-decoration: none;
  color: #29243b;
}
.hero {
  text-align: center;
  padding: 65px 20px;
  color: white;
  background: linear-gradient(135deg, #7655e8, #ed83b5);
}
.hero h1 { font-size: 42px; margin: 0 0 15px; }
.hero p { font-size: 17px; }
button {
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  background: #7546db;
  color: white;
  cursor: pointer;
}
.hero button { background: white; color: #7546db; }
section { padding: 35px 7%; }
h2 { text-align: center; }
.products {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}
.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 15px #e9dfed;
  padding-bottom: 18px;
  text-align: center;
}
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #f1eafa;
}
.card h3 { font-size: 17px; }
.price { font-weight: bold; color: #7546db; }
.card button { margin-top: 8px; }
#cart {
  max-width: 600px;
  margin: auto;
  background: white;
  border-radius: 14px;
  padding: 20px;
}
.cart-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid #eee;
  padding: 12px 0;
}
.remove { background: #e75480; padding: 7px 10px; }
footer {
  text-align: center;
  padding: 24px;
  background: #29243b;
  color: white;
}
@media(max-width: 750px) {
  .products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  header { padding: 16px 4%; }
  nav a { margin-left: 8px; font-size: 13px; }
  .hero h1 { font-size: 32px; }
  section { padding: 25px 4%; }
}
@media(max-width: 380px) {
  .products { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<header>
  <div class="logo">MyShop ✨</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">🛒 Cart (<span id="count">0</span>)</a>
  </nav>
</header>

<div class="hero" id="home">
  <h1>Shop Your Style!</h1>
  <p>Discover amazing products at amazing prices.</p>
  <button onclick="document.getElementById('products').scrollIntoView()">
    Shop Now →
  </button>
</div>

<section id="products">
  <h2>🌟 Featured Products</h2>
  <div class="products" id="product-list"></div>
</section>

<section id="cart">
  <h2>🛒 Your Shopping Cart</h2>
  <div id="cart-items">Your cart is empty.</div>
  <h3>Total: ₹<span id="total">0</span></h3>
  <button onclick="checkout()">Proceed to Checkout</button>
</section>

<footer>
  <p>© 2026 MyShop. Made with ❤️</p>
</footer>

<script>
const products = [
  {
    id: 1, name: "Wireless Headphones", price: 999,
    image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
  },
  {
    id: 2, name: "Smart Watch", price: 1599,
    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
  },
  {
    id: 3, name: "Stylish Backpack", price: 799,
    image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
  },
  {
    id: 4, name: "Running Shoes", price: 1299,
    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
  }
];

let cart = [];

function displayProducts() {
  const list = document.getElementById("product-list");
  list.innerHTML = "";

  products.forEach(product => {
    list.innerHTML += `
      <div class="card">
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p class="price">₹${product.price}</p>
        <button onclick="addToCart(${product.id})">
          Add to Cart
        </button>
      </div>`;
  });
}

function addToCart(id) {
  const item = cart.find(product => product.id === id);

  if (item) {
    item.quantity++;
  } else {
    cart.push({
      ...products.find(product => product.id === id),
      quantity: 1
    });
  }

  displayCart();
}

function removeFromCart(id) {
  cart = cart.filter(item => item.id !== id);
  displayCart();
}

function displayCart() {
  const items = document.getElementById("cart-items");
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  document.getElementById("count").textContent = count;
  document.getElementById("total").textContent = total;

  if (cart.length === 0) {
    items.textContent = "Your cart is empty.";
    return;
  }

  items.innerHTML = cart.map(item => `
    <div class="cart-row">
      <span>${item.name} × ${item.quantity}</span>
      <span>₹${item.price * item.quantity}</span>
      <button class="remove"
        onclick="removeFromCart(${item.id})">Remove</button>
    </div>
  `).join("");
}

function checkout() {
  if (cart.length === 0) {
    alert("Please add a product to your cart first!");
    return;
  }

  alert("This is a demo store. Online payment is not connected yet.");
}

displayProducts();
displayCart();
</script>
</body>
</html>
